name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-pr-size:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const additions = pr.data.additions;
            const deletions = pr.data.deletions;
            const total = additions + deletions;

            core.setOutput("total", total);
            core.setOutput("additions", additions);
            core.setOutput("deletions", deletions);

      - name: Check PR size limit
        run: |
          MAX_SIZE=800    # ✅ Лимит строк (можешь изменить)
          echo "Additions: ${{ steps.pr.outputs.additions }}"
          echo "Deletions: ${{ steps.pr.outputs.deletions }}"
          echo "Total changed: ${{ steps.pr.outputs.total }}"

          if [ ${{ steps.pr.outputs.total }} -gt $MAX_SIZE ]; then
            echo "❌ Pull request слишком большой!"
            echo "Максимум: $MAX_SIZE строк"
            exit 1
          else
            echo "✅ Размер PR в пределах нормы."
          fi